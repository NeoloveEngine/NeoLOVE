name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev xvfb mesa-vulkan-drivers

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D clippy::dbg_macro -D clippy::todo -D clippy::unwrap_used

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build 3D visual parity runner
        if: runner.os == 'Linux'
        run: cargo build --features vulkan

      - name: Validate software and Vulkan 3D runtime parity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture=test-artifacts/projects/3d-parity-pbr
          baseline="$fixture/baseline/software-320x180.png"
          xvfb-run -a target/debug/neolove validate-3d "$fixture" \
            --baseline "$baseline" --backend software --width 320 --height 180 \
            --report "$RUNNER_TEMP/3d-software-report.json" \
            --diff "$RUNNER_TEMP/3d-software-diff.png"
          xvfb-run -a target/debug/neolove validate-3d "$fixture" \
            --baseline "$baseline" --backend vulkan --width 320 --height 180 \
            --report "$RUNNER_TEMP/3d-vulkan-report.json" \
            --diff "$RUNNER_TEMP/3d-vulkan-diff.png"

      - name: Check WebAssembly Bootstrap Build
        if: runner.os == 'Linux'
        run: cargo check --target wasm32-unknown-unknown
