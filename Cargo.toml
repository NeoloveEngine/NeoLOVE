[package]
name = "neolove"
version = "0.1.0"
edition = "2024"
default-run = "neolove"

[lib]
name = "neolove"
crate-type = ["cdylib"]
path = "src/main_android.rs"

[features]
default = []
vulkan = ["dep:naga", "dep:vulkano"]
packaged-launcher = []

[[bin]]
name = "neolove-launcher"
path = "src/packaged_launcher.rs"
required-features = ["packaged-launcher"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "0.11.5", features = ["luau"] }
hound = "3.5.1"
rapier2d = "0.23"
bytemuck = { version = "1.16.1", features = ["derive"] }
fontdue = "0.9.3"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "pnm", "webp", "hdr", "dds"] }
base64 = "0.21.7"
rodio = { version = "0.20.1", default-features = false, features = ["wav", "mp3", "flac", "vorbis"] }
vulkano = { version = "0.34.1", optional = true }
winit = { version = "0.28.7", features = ["android-native-activity"] }
rustls = { version = "0.23.18", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26.7"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rmp-serde = "1.3.1"
flate2 = "1.1.9"
ring = "0.17.14"
rustls-pemfile = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
naga = { version = "29.0.1", default-features = false, features = ["glsl-in", "spv-out"], optional = true }
uuid = { version = "1.22.0", features = ["v4", "v7"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
softbuffer = "0.3.4"
rfd = "0.17.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
cpal = "0.15.3"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-avfoundation"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk = "0.7.0"
ndk-sys = "0.4.1"
raw-window-handle = "0.5.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "emscripten"))'.dependencies]
mlua = { version = "0.11.5", features = ["luau"] }
hound = "3.5.1"
rapier2d = "0.23"
bytemuck = { version = "1.16.1", features = ["derive"] }
fontdue = "0.9.3"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "pnm", "webp", "hdr", "dds"] }
base64 = "0.21.7"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmp-serde = "1.3.1"

[build-dependencies]
cc = "1.2.43"

[profile.release]
# Games favor sustained frame time over minimum executable size. Fat LTO and a
# single codegen unit retain cross-crate optimization while level 3 enables the
# vectorization and loop transforms used by lighting, physics, and mesh code.
opt-level = 3
lto = "fat"
codegen-units = 1
# Strip symbols in release builds so the engine executable and exported desktop
# games have a smaller base binary.
strip = "symbols"
# Runtime and renderer entry points deliberately catch panics and turn them into
# actionable error dialogs. Keep unwinding enabled in release builds so those
# guards work instead of terminating with an unexplained native abort.
panic = "unwind"
debug = false
incremental = false

[profile.release.build-override]
debug = false
